<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Interface Vocale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050b14;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        header {
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
        }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        header p { font-size: 0.8rem; color: #88c0d0; }

        /* Centre : Le Réacteur Arc (Interface Animée) */
        .jarvis-core {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 255, 255, 0.3);
            animation: spin 10s linear infinite;
        }
        .ring:nth-child(1) { width: 100%; height: 100%; border-color: #00ffff; border-width: 3px; }
        .ring:nth-child(2) { width: 75%; height: 75%; animation-direction: reverse; animation-duration: 6s; border-style: solid; }
        .ring:nth-child(3) { width: 50%; height: 50%; animation-duration: 4s; }

        .core-center {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00ffff 0%, #004466 70%, #050b14 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px #00ffff, inset 0 0 15px #ffffff;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
            }
        @keyframes pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px #00ffff; }
        }

        /* Console de discussion / Logs */
        .terminal {
            width: 100%;
            max-width: 600px;
            height: 150px;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #00ffff;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .log-line { margin-bottom: 5px; }
        .user-text { color: #ebcb8b; }
        .jarvis-text { color: #88c0d0; }

        /* Bouton d'activation */
        .controls {
            margin-bottom: 10px;
        }
        button {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: 0.3s;
        }
        button:hover {
            background: #00ffff;
            color: #050b14;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S. SYSTEM</h1>
        <p>Interface Vocale Neuronale v1.0</p>
    </header>

    <div class="jarvis-core">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core-center" id="coreCenter"></div>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line jarvis-text">> Système initialisé. En attente d'activation...</div>
    </div>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleJarvis()">Activer l'écoute</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const coreCenter = document.getElementById('coreCenter');
        const toggleBtn = document.getElementById('toggleBtn');

        let isListening = false;
        let recognition = null;

        function addLog(text, sender = 'jarvis') {
            const div = document.createElement('div');
            div.className = `log-line ${sender === 'user' ? 'user-text' : 'jarvis-text'}`;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.9; // Voix un peu plus grave / robotique
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Configuration de la reconnaissance vocale
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true; // Écoute en continu
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                toggleBtn.innerText = "Désactiver l'écoute";
                coreCenter.style.background = "radial-gradient(circle, #00ff00 0%, #004400 70%, #050b14 100%)";
                addLog("> [Système] Écoute active...");
            };

            recognition.onresult = async (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                addLog(`> Vous : ${speechResult}`, 'user');
                
                // Traitement de la commande ou appel IA
                await handleJarvisResponse(speechResult);
            };

            recognition.onerror = (event) => {
                console.error("Erreur vocale :", event.error);
            };

            recognition.onend = () => {
                if (isListening) {
                    // Relance automatique pour maintenir l'écoute en continu
                    try { recognition.start(); } catch(e) {}
                } else {
                    toggleBtn.innerText = "Activer l'écoute";
                    coreCenter.style.background = "radial-gradient(circle, #00ffff 0%, #004466 70%, #050b14 100%)";
                    addLog("> [Système] Écoute en pause.");
                }
            };
        } else {
            alert("Votre navigateur ne supporte pas la reconnaissance vocale (utilisez Chrome ou Edge).");
        }

        function toggleJarvis() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Cerveau de Jarvis (Réponses locales ou connexion à une IA gratuite)
        async function handleJarvisResponse(input) {
            let reply = "";
            const lowerInput = input.toLowerCase();

            if (lowerInput.includes("bonjour") || lowerInput.includes("salut")) {
                reply = "Bonjour. Tous les systèmes sont opérationnels. Que puis-je faire pour vous ?";
            } else if (lowerInput.includes("heure")) {
                const now = new Date();
                reply = `Il est actuellement ${now.getHours()} heures ${now.getMinutes()}.`;
            } else {
                // EXEMPLE : Vous pouvez remplacer cette section par un appel fetch() vers l'API Gemini (gratuite)
                reply = `J'ai bien reçu votre demande : "${input}". Connexion aux serveurs en cours.`;
                
                // Simulation d'une réponse intelligente
                setTimeout(() => {
                    const dynamicReply = "Traitement terminé. Commande exécutée avec succès.";
                    addLog(`> Jarvis : ${dynamicReply}`);
                    speak(dynamicReply);
                }, 1000);
                return;
            }

            addLog(`> Jarvis : ${reply}`);
            speak(reply);
        }
    </script>
</body>
</html>
