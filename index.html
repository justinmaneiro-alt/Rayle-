<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raylé - True Neural Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030103;
            color: #ff007f;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1f0515 0%, #030103 100%);
        }
        header { text-align: center; letter-spacing: 4px; text-shadow: 0 0 12px rgba(255, 0, 127, 0.8); }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; color: #ff3399; }
        header p { font-size: 0.75rem; color: #ff66b2; text-transform: uppercase; letter-spacing: 2px; }

        /* CONFIG API TOKEN */
        .api-config {
            background: rgba(20, 2, 12, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.5);
            padding: 6px 12px;
            border-radius: 5px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: -10px;
        }
        .api-config input {
            background: #030103;
            border: 1px solid #ff007f;
            color: #ffb3d9;
            padding: 4px 8px;
            font-family: inherit;
            border-radius: 3px;
            width: 200px;
        }

        /* LOGO / RÉACTEUR ANIMÉ NOIR ET ROSE TRANSPARENT */
        .holo-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.5));
        }
        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(255, 0, 127, 0.25);
            animation: spin 20s linear infinite;
        }
        .ring-pink-1 { width: 100%; height: 100%; border: 3px solid rgba(255, 0, 127, 0.35); border-top: 3px solid #ff007f; border-bottom: 3px solid #800040; animation-duration: 12s; }
        .ring-pink-2 { width: 84%; height: 84%; border: 2px dotted rgba(255, 102, 178, 0.6); animation-direction: reverse; animation-duration: 18s; }
        .ring-pink-3 { width: 68%; height: 68%; border: 4px solid rgba(128, 0, 64, 0.3); border-left: 4px solid #ff007f; border-right: 4px solid #ff3399; animation-duration: 7s; }

        .holo-core {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #ffffff 0%, #ff007f 40%, #3d001f 80%, #030103 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.8), inset 0 0 20px #ffffff;
            animation: pulse-pink 2s ease-in-out infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-pink {
            0%, 100% { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 25px rgba(255, 0, 127, 0.6); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 55px rgba(255, 0, 127, 0.9); }
        }

        /* TERMINAL DE DISCUSSION */
        .terminal {
            width: 100%;
            max-width: 650px;
            height: 160px;
            background: rgba(10, 2, 7, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.85rem;
            box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.15);
        }
        .log-line { margin-bottom: 6px; line-height: 1.4; }
        .user-text { color: #ffb3d9; }
        .jarvis-text { color: #ff80bf; }
        .error-text { color: #ff6666; }

        /* BOUTON DE CONTRÔLE */
        .controls { margin-bottom: 5px; }
        button {
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 10px 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover { background: #ff007f; color: #030103; box-shadow: 0 0 30px #ff007f; }
    </style>
</head>
<body>

    <header>
        <h1>R A Y L É</h1>
        <p>Neural Core Systems</p>
    </header>

    <!-- Zone pour coller le Token Hugging Face gratuit -->
    <div class="api-config">
        <span>Token Hugging Face :</span>
        <input type="password" id="tokenInput" placeholder="Colle ton token ici">
        <button onclick="saveToken()" style="padding: 3px 8px; font-size: 0.65rem;">Enregistrer</button>
    </div>

    <div class="holo-container">
        <div class="holo-ring ring-pink-1"></div>
        <div class="holo-ring ring-pink-2"></div>
        <div class="holo-ring ring-pink-3"></div>
        <div class="holo-core" id="coreCenter"></div>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line jarvis-text">> Entrez votre Token Hugging Face gratuit ci-dessus pour activer la vraie IA générative de Raylé, Monsieur.</div>
    </div>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleRayle()">Activer l'écoute</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const coreCenter = document.getElementById('coreCenter');
        const toggleBtn = document.getElementById('toggleBtn');
        const tokenInput = document.getElementById('tokenInput');

        if(localStorage.getItem('rayle_hf_token')) {
            tokenInput.value = localStorage.getItem('rayle_hf_token');
        }

        function saveToken() {
            const token = tokenInput.value.trim();
            if(token) {
                localStorage.setItem('rayle_hf_token', token);
                addLog("> [Système] Token enregistré avec succès. Vraie IA active, Monsieur.");
            }
        }

        function addLog(text, type = 'rayle') {
            const div = document.createElement('div');
            div.className = `log-line ${type === 'user' ? 'user-text' : type === 'error' ? 'error-text' : 'jarvis-text'}`;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.85; 
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        let isListening = false;
        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                toggleBtn.innerText = "Désactiver l'écoute";
                coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #ff3399 40%, #400020 80%, #030103 100%)";
                addLog("> [Système] Audio actif. Raylé vous écoute, Monsieur.");
            };

            recognition.onresult = async (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                addLog(`> Vous : ${speechResult}`, 'user');
                await askTrueAI(speechResult);
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    toggleBtn.innerText = "Activer l'écoute";
                    coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #ff007f 40%, #3d001f 80%, #030103 100%)";
                    addLog("> [Système] Veille activée.");
                }
            };
        } else {
            alert("Veuillez utiliser Google Chrome ou Microsoft Edge.");
        }

        function toggleRayle() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Connexion à une vraie IA via l'API Hugging Face
        async function askTrueAI(prompt) {
            const token = localStorage.getItem('rayle_hf_token') || tokenInput.value.trim();
            if (!token) {
                addLog("> [Erreur] Veuillez d'abord enregistrer un token Hugging Face en haut de la page.", "error");
                speak("Veuillez entrer votre token, Monsieur.");
                return;
            }

            addLog("> [Raylé] Connexion au réseau neuronal et génération...");

            try {
                // Utilisation d'un modèle performant et gratuit
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `[INST] Tu es Raylé, un assistant virtuel sophistiqué et intelligent. Tu réponds toujours en français de manière directe et professionnelle en appelant ton utilisateur "Monsieur". Réponds à cette question : ${prompt} [/INST]`,
                        parameters: { max_new_tokens: 150, return_full_text: false }
                    })
                });

                const data = await response.json();
                
                if (data && data[0] && data[0].generated_text) {
                    let reply = data[0].generated_text.trim();
                    addLog(`> Raylé : ${reply}`);
                    speak(reply);
                } else if (data.error) {
                    addLog(`> [Erreur API] ${data.error}`, "error");
                } else {
                    addLog("> [Erreur] Réponse inattendue du serveur.", "error");
                }
            } catch (err) {
                console.error(err);
                addLog("> [Erreur] Échec de la requête réseau vers l'IA.", "error");
            }
        }
    </script>
</body>
</html>
