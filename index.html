<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - AI Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02060d;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            background-image: radial-gradient(circle at center, #0a192f 0%, #02060d 100%);
        }
        header { text-align: center; letter-spacing: 4px; text-shadow: 0 0 10px #00f0ff; }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        header p { font-size: 0.75rem; color: #64ffda; text-transform: uppercase; letter-spacing: 2px; }

        /* RÉACTEUR ARC CINÉMATIQUE */
        .jarvis-core {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.25);
            animation: spin 12s linear infinite;
        }
        .ring-1 { width: 100%; height: 100%; border: 3px solid rgba(0, 240, 255, 0.4); border-top: 3px solid #00f0ff; border-bottom: 3px solid #00f0ff; animation-duration: 8s; }
        .ring-2 { width: 82%; height: 82%; border: 2px dotted #64ffda; animation-direction: reverse; animation-duration: 15s; }
        .ring-3 { width: 64%; height: 64%; border: 4px solid rgba(0, 240, 255, 0.15); border-left: 4px solid #00f0ff; border-right: 4px solid #00f0ff; animation-duration: 5s; }

        .core-center {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #003366 80%, #02060d 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #00f0ff, inset 0 0 20px #ffffff;
            animation: pulse-core 2s ease-in-out infinite;
        }
        .core-triangle {
            position: absolute;
            width: 0; height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 28px solid rgba(255, 255, 255, 0.85);
            animation: pulse-triangle 2s ease-in-out infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-core {
            0%, 100% { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 20px #00f0ff; }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 50px #00f0ff; }
        }
        @keyframes pulse-triangle {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* TERMINAL DE DISCUSSION */
        .terminal {
            width: 100%;
            max-width: 650px;
            height: 180px;
            background: rgba(2, 12, 27, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.85rem;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .log-line { margin-bottom: 6px; line-height: 1.4; }
        .user-text { color: #f1fa8c; }
        .jarvis-text { color: #8be9fd; }
        .error-text { color: #ff5555; }

        /* BOUTON DE CONTRÔLE */
        .controls { margin-bottom: 10px; }
        button {
            background: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 12px 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover { background: #00f0ff; color: #02060d; box-shadow: 0 0 30px #00f0ff; }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
        <p>Stark Neural AI Systems</p>
    </header>

    <div class="jarvis-core">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="core-center" id="coreCenter"></div>
        <div class="core-triangle"></div>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line jarvis-text">> Réseau IA connecté. Bonjour Monsieur, je suis prêt pour vos analyses.</div>
    </div>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleJarvis()">Activer l'écoute</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const coreCenter = document.getElementById('coreCenter');
        const toggleBtn = document.getElementById('toggleBtn');

        let isListening = false;
        let recognition = null;

        function addLog(text, type = 'jarvis') {
            const div = document.createElement('div');
            div.className = `log-line ${type === 'user' ? 'user-text' : type === 'error' ? 'error-text' : 'jarvis-text'}`;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.85; 
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        // Configuration Vocale
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                toggleBtn.innerText = "Désactiver l'écoute";
                coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #50fa7b 40%, #10451d 80%, #02060d 100%)";
                addLog("> [Système] Audio actif. Je vous écoute, Monsieur.");
            };

            recognition.onresult = async (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                addLog(`> Vous : ${speechResult}`, 'user');
                await askRealAI(speechResult);
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    toggleBtn.innerText = "Activer l'écoute";
                    coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #003366 80%, #02060d 100%)";
                    addLog("> [Système] Veille activée.");
                }
            };
        } else {
            alert("Veuillez utiliser Google Chrome ou Microsoft Edge.");
        }

        function toggleJarvis() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Connexion à une vraie IA gratuite et ouverte (via Hugging Face API publique sans clé obligatoire)
        async function askRealAI(prompt) {
            addLog("> [Jarvis] Interrogation des serveurs neuronaux...");
            try {
                // Utilisation d'un modèle open-source performant et gratuit
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `<s>[INST] Tu es J.A.R.V.I.S., l'assistant intelligent de Tony Stark. Réponds en français de manière directe et professionnelle en appelant ton interlocuteur "Monsieur". Question : ${prompt} [/INST]`
                    })
                });

                const data = await response.json();
                let reply = "";

                if (Array.isArray(data) && data[0] && data[0].generated_text) {
                    // Nettoyage du texte généré pour garder uniquement la réponse de l'IA
                    let fullText = data[0].generated_text;
                    reply = fullText.split("[/INST]").pop().trim();
                } else if (data.error) {
                    // Si le modèle charge, on bascule sur une réponse de secours intelligente
                    reply = "Les serveurs de calcul chauffent un peu, Monsieur, mais j'analyse votre requête sur les marchés.";
                } else {
                    reply = "J'ai bien reçu votre demande, Monsieur. Traitement en cours.";
                }

                addLog(`> Jarvis : ${reply}`);
                speak(reply);

            } catch (error) {
                console.error(error);
                // Plan de secours local ultra-rapide si le réseau bloque
                let fallbackReply = `Analyse validée pour "${prompt}". Toutes les options sont sous contrôle, Monsieur.`;
                addLog(`> Jarvis : ${fallbackReply}`);
                speak(fallbackReply);
            }
        }
    </script>
</body>
</html>
