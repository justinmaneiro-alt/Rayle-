<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Core Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02060d;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 15px;
            background-image: radial-gradient(circle at center, #0a192f 0%, #02060d 100%);
        }
        header { text-align: center; letter-spacing: 3px; text-shadow: 0 0 10px #00f0ff; }
        header h1 { font-size: 1.5rem; margin-bottom: 3px; }
        header p { font-size: 0.7rem; color: #64ffda; text-transform: uppercase; }

        /* Configuration API Key box */
        .api-config {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .api-config input {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 3px 6px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.75rem;
            outline: none;
        }

        /* RÉACTEUR ARC CINÉMATIQUE */
        .jarvis-core {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.25);
            animation: spin 12s linear infinite;
        }
        .ring-1 { width: 100%; height: 100%; border: 3px solid rgba(0, 240, 255, 0.4); border-top: 3px solid #00f0ff; border-bottom: 3px solid #00f0ff; animation-duration: 8s; }
        .ring-2 { width: 82%; height: 82%; border: 2px dotted #64ffda; animation-direction: reverse; animation-duration: 15s; }
        .ring-3 { width: 64%; height: 64%; border: 4px solid rgba(0, 240, 255, 0.15); border-left: 4px solid #00f0ff; border-right: 4px solid #00f0ff; animation-duration: 5s; }

        .core-center {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #003366 80%, #02060d 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px #00f0ff, inset 0 0 15px #ffffff;
            animation: pulse-core 2s ease-in-out infinite;
        }
        .core-triangle {
            position: absolute;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 26px solid rgba(255, 255, 255, 0.8);
            animation: pulse-triangle 2s ease-in-out infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-core {
            0%, 100% { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 15px #00f0ff; }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 40px #00f0ff; }
        }
        @keyframes pulse-triangle {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* TERMINAL */
        .terminal {
            width: 100%;
            max-width: 650px;
            height: 160px;
            background: rgba(2, 12, 27, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .log-line { margin-bottom: 5px; line-height: 1.3; }
        .user-text { color: #f1fa8c; }
        .jarvis-text { color: #8be9fd; }
        .error-text { color: #ff5555; }

        /* CONTRÔLES */
        .controls { margin-bottom: 5px; }
        button {
            background: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 10px 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover { background: #00f0ff; color: #02060d; box-shadow: 0 0 25px #00f0ff; }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
        <p>Stark Intelligence Systems</p>
    </header>

    <div class="api-config">
        <label for="apiKeyInput">Clé API Gemini :</label>
        <input type="password" id="apiKeyInput" placeholder="Colle ta clé ici...">
        <button onclick="saveApiKey()" style="padding: 3px 8px; font-size: 0.7rem;">Sauver</button>
    </div>

    <div class="jarvis-core">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="core-center" id="coreCenter"></div>
        .core-triangle
        <div class="core-triangle"></div>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line jarvis-text">> Systèmes en ligne. Veuillez entrer votre clé API Gemini pour activer les protocoles neuronaux.</div>
    </div>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleJarvis()">Activer l'écoute</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const coreCenter = document.getElementById('coreCenter');
        const toggleBtn = document.getElementById('toggleBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        let isListening = false;
        let recognition = null;
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        if (apiKey) {
            apiKeyInput.value = apiKey;
        }

        function saveApiKey() {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            addLog("> [Système] Clé API enregistrée avec succès.");
        }

        function addLog(text, type = 'jarvis') {
            const div = document.createElement('div');
            div.className = `log-line ${type === 'user' ? 'user-text' : type === 'error' ? 'error-text' : 'jarvis-text'}`;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Stoppe la parole précédente
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.85; 
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        // Configuration Vocale
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                toggleBtn.innerText = "Désactiver l'écoute";
                coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #50fa7b 40%, #10451d 80%, #02060d 100%)";
                addLog("> [Système] Écoute active. Je vous écoute, Monsieur.");
            };

            recognition.onresult = async (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                addLog(`> Vous : ${speechResult}`, 'user');
                await askGemini(speechResult);
            };

            recognition.onerror = (event) => {
                console.error("Erreur vocale :", event.error);
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    toggleBtn.innerText = "Activer l'écoute";
                    coreCenter.style.background = "radial-gradient(circle, #ffffff 0%, #00f0ff 40%, #003366 80%, #02060d 100%)";
                    addLog("> [Système] Veille activée.");
                }
            };
        } else {
            alert("Veuillez utiliser Google Chrome ou Microsoft Edge pour la reconnaissance vocale.");
        }

        function toggleJarvis() {
            if (!recognition) return;
            if (!apiKey) {
                alert("Veuillez d'abord renseigner votre clé API Gemini !");
                return;
            }
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Appel direct à l'API Gemini (Gratuit)
        async function askGemini(prompt) {
            addLog("> [Jarvis] Analyse et traitement par l'IA...");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Tu es J.A.R.V.I.S., l'intelligence artificielle de Tony Stark. Tu réponds toujours en français, de manière polie, professionnelle, un peu robotique et en appelant ton interlocuteur "Monsieur". Sois concis car tes réponses sont lues à haute voix. Question de l'utilisateur : ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    addLog(`> Jarvis : ${reply}`);
                    speak(reply);
                } else {
                    throw new Error("Réponse invalide de l'API");
                }
            } catch (error) {
                console.error(error);
                const errText = "Erreur de connexion aux serveurs Stark ou clé API invalide.";
                addLog(`> [Erreur] ${errText}`, 'error');
                speak(errText);
            }
        }
    </script>
</body>
</html>
