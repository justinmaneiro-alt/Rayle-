name: alertes
# Alertes Telegram des flèches v8 SANS le PC : même moteur et mêmes règles que alertes-serveur.mjs (--une-fois), anti-spam existant
# (6 par heure et par actif, 5 min entre deux messages d'un même niveau, déduplication). L'état est gardé entre deux passages dans le fichier
# etat/alertes-etat.json de la branche « donnees ». Aucun ordre n'est jamais envoyé.
# HONNÊTETÉ : GitHub lance ce travail « au mieux » toutes les 5 minutes ; des retards de quelques minutes (parfois plus) sont normaux.
# Ce n'est PAS du temps réel à la seconde. Secrets requis (jamais dans le dépôt) : TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: donnees-branche
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  alertes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REGISTRE_DIRECT: '0'
      ALERTES_FLECHES_H1: '0'   # 2026-11-15 : les signaux sont maintenant les signaux H4 / Jour (étape suivante) ; les flèches H1 ne partent plus par Telegram depuis GitHub
      ALERTES_ETAT: ${{ github.workspace }}/etat-sortie/etat/alertes-etat.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reprendre l'état (branche donnees)
        env:
          JETON: ${{ github.token }}
        run: |
          git clone --depth 1 --branch donnees "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" etat-sortie 2>/dev/null || mkdir -p etat-sortie
          rm -rf etat-sortie/.git; mkdir -p etat-sortie/etat
      - name: Vérifier les secrets (sans jamais les afficher)
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::warning::Secrets Telegram absents : les alertes sont calculées mais aucun message n'est envoyé."; fi
      - name: Un passage des alertes
        run: node agent-trading/alertes-serveur.mjs --une-fois 2>&1 | sed -E "s/${TELEGRAM_BOT_TOKEN:-__aucun__}/***/g"
      - name: Alertes H4 / Jour (nouveaux signaux, contact avec la MA200 H4 / J ou un niveau Jour fort)
        run: node trader-pro/terminal/alertes-hj.mjs --donnees etat-sortie --etat etat-sortie/etat/alertes-hj-etat.json 2>&1 | sed -E "s/${TELEGRAM_BOT_TOKEN:-__aucun__}/***/g"
      - name: Publier l'état (seulement le fichier d'état, sans toucher aux snapshots)
        env:
          JETON: ${{ github.token }}
        run: |
          cd etat-sortie
          git init -q -b donnees
          git config user.name "rayle-alertes"
          git config user.email "rayle-alertes@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "état inchangé"; exit 0; }
          git commit -q -m "état des alertes $(date -u +%FT%TZ)"
          # on ne force-pousse que si la branche n'a pas bougé entre-temps (sinon on laisse le prochain passage refaire le travail)
          ATTENDU=$(git ls-remote "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/donnees | cut -f1)
          git push -q --force-with-lease=donnees:"${ATTENDU}" "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" donnees || echo "branche modifiée pendant le passage : état republié au prochain passage"
