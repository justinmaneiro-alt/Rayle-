<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal</title>
<style>
  :root{
    --bg0:#070b16; --bg1:#0c1322; --glass:rgba(18,26,44,.5);
    --line:rgba(120,140,190,.16); --ink:#e9eefb; --muted:#8a95b4; --accent:#6aa6ff;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(90vw 60vh at 85% -10%, rgba(106,166,255,.10), transparent 60%),
      radial-gradient(70vw 50vh at 0% 110%, rgba(25,195,125,.08), transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg0));
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; min-height:100%;
  }
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 20px; position:sticky;top:0;z-index:20;
    background:rgba(8,12,22,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  }
  .logo{font-weight:300;letter-spacing:.38em;font-size:15px;color:var(--muted);text-indent:.38em}
  .logo b{color:var(--ink);font-weight:600}
  .sym-switch{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .sym-switch button{border:1px solid var(--line);background:var(--glass);color:var(--muted);
    padding:8px 16px;border-radius:30px;font-size:14px;cursor:pointer;transition:.2s}
  .sym-switch button.active{background:var(--accent);color:#04121c;border-color:transparent;font-weight:600}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

  main{display:grid;gap:14px;padding:16px;grid-template-columns:repeat(3,1fr);
    grid-template-areas:"d1 d2 d3" "chart chart cal" "rsi rsi cal";}
  @media(max-width:1100px){main{grid-template-columns:1fr 1fr;
    grid-template-areas:"d1 d2" "d3 d3" "chart chart" "rsi rsi" "cal cal";}}
  @media(max-width:680px){main{grid-template-columns:1fr;
    grid-template-areas:"d1" "d2" "d3" "chart" "rsi" "cal";}}

  .card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column}
  .card h2{margin:0;padding:12px 16px;font-size:13px;font-weight:600;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
    color:var(--muted);text-transform:uppercase}
  .card h2 .px{color:var(--ink);font-weight:500}
  .tvbox{flex:1}
  .tvbox>*{height:100%!important}

  .d1{grid-area:d1}.d2{grid-area:d2}.d3{grid-area:d3}
  .dash{min-height:420px}
  .chart{grid-area:chart;min-height:480px}
  .chart .tvbox{min-height:440px}
  .rsiwrap{grid-area:rsi}
  .rsi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:900px){.rsi-grid{grid-template-columns:1fr}}
  .rsi-grid .card{min-height:240px}
  .rsi-grid .tvbox{min-height:200px}
  .cal{grid-area:cal;min-height:620px}
</style>
</head>
<body>
  <header>
    <div class="logo"><b>RYLÉ</b> TERMINAL</div>
    <div class="sym-switch" id="symSwitch"></div>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <section class="card dash d1"><h2>NASDAQ 100</h2><div class="tvbox" id="dash-NDX"></div></section>
    <section class="card dash d2"><h2>BTC / USD</h2><div class="tvbox" id="dash-BTC"></div></section>
    <section class="card dash d3"><h2>SOLANA</h2><div class="tvbox" id="dash-SOL"></div></section>

    <section class="card chart">
      <h2>Graphique — MA 200 <span class="px" id="chartSym">NASDAQ</span></h2>
      <div class="tvbox" id="tv-chart"></div>
    </section>

    <div class="rsiwrap">
      <div class="rsi-grid">
        <section class="card"><h2>RSI — NASDAQ</h2><div class="tvbox" id="rsi-NDX"></div></section>
        <section class="card"><h2>RSI — BTC</h2><div class="tvbox" id="rsi-BTC"></div></section>
        <section class="card"><h2>RSI — SOLANA</h2><div class="tvbox" id="rsi-SOL"></div></section>
      </div>
    </div>

    <section class="card cal"><h2>Calendrier économique</h2><div class="tvbox" id="tv-cal"></div></section>
  </main>

<script>
(function(){
  "use strict";
  const clock=document.getElementById('clock');
  setInterval(()=>clock.textContent=new Date().toLocaleTimeString('fr-FR'),1000);

  const SYMS={
    NDX:{label:'NASDAQ', tv:'NASDAQ:NDX'},
    BTC:{label:'BTC',    tv:'BINANCE:BTCUSDT'},
    SOL:{label:'SOLANA', tv:'BINANCE:SOLUSDT'},
  };

  function tvWidget(containerId, scriptUrl, cfg){
    const el=document.getElementById(containerId); el.innerHTML='';
    const wrap=document.createElement('div'); wrap.className='tradingview-widget-container'; wrap.style.height='100%';
    const inner=document.createElement('div'); inner.className='tradingview-widget-container__widget'; inner.style.height='100%';
    wrap.appendChild(inner);
    const s=document.createElement('script'); s.src=scriptUrl; s.async=true; s.type='text/javascript';
    s.innerHTML=JSON.stringify(cfg); wrap.appendChild(s); el.appendChild(wrap);
  }

  // Dashboards = widget "Analyse technique" (jauge Achat/Vente par unité de temps, sans clé)
  function loadDash(contId, s){
    tvWidget(contId,'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js',{
      symbol:s.tv, interval:'1h', width:'100%', height:'100%',
      colorTheme:'dark', isTransparent:true, locale:'fr', showIntervalTabs:true, displayMode:'single'
    });
  }

  function loadChart(symKey){
    const s=SYMS[symKey];
    document.getElementById('chartSym').textContent=s.label;
    tvWidget('tv-chart','https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js',{
      symbol:s.tv, interval:'15', theme:'dark', style:'1', locale:'fr', timezone:'Europe/Paris',
      autosize:true, allow_symbol_change:false,
      studies:['STD;SMA'], studies_overrides:{'moving average.length':200,'moving average.plot.color':'#f5b642'},
      backgroundColor:'rgba(12,19,34,0)', gridColor:'rgba(120,140,190,0.08)'
    });
  }
  function loadRSI(contId,s){
    tvWidget(contId,'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js',{
      symbol:s.tv, interval:'15', theme:'dark', style:'1', locale:'fr', timezone:'Europe/Paris',
      autosize:true, hide_top_toolbar:true, hide_side_toolbar:true, hide_legend:true, allow_symbol_change:false,
      studies:['STD;RSI'], backgroundColor:'rgba(12,19,34,0)', gridColor:'rgba(120,140,190,0.08)'
    });
  }
  function loadCalendar(){
    tvWidget('tv-cal','https://s3.tradingview.com/external-embedding/embed-widget-events.js',{
      colorTheme:'dark', isTransparent:true, locale:'fr', countryFilter:'us,eu,fr,gb,jp',
      importanceFilter:'0,1', width:'100%', height:'100%'
    });
  }

  const switchEl=document.getElementById('symSwitch');
  Object.keys(SYMS).forEach((k,i)=>{
    const b=document.createElement('button'); b.textContent=SYMS[k].label; if(i===0)b.classList.add('active');
    b.onclick=()=>{ [...switchEl.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); loadChart(k); };
    switchEl.appendChild(b);
  });

  loadDash('dash-NDX', SYMS.NDX);
  loadDash('dash-BTC', SYMS.BTC);
  loadDash('dash-SOL', SYMS.SOL);
  loadChart('NDX');
  loadRSI('rsi-NDX', SYMS.NDX);
  loadRSI('rsi-BTC', SYMS.BTC);
  loadRSI('rsi-SOL', SYMS.SOL);
  loadCalendar();
})();
</script>
</body>
</html>
