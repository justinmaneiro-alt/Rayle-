<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAYLÉ // Market &amp; Neural Core</title>
<style>
  :root{
    --bg:#030103; --pink:#ff007f; --pink2:#ff3399; --light:#ffb3d9; --dim:#8a5a73;
    --mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(ellipse 85% 60% at 50% 22%, rgba(255,0,127,.30), rgba(255,0,127,.07) 45%, transparent 72%),
      var(--bg);
    color:var(--light); font-family:var(--mono);
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ───── En-tête ───── */
  header{text-align:center;margin-top:6px}
  header h1{
    margin:0; font-size:clamp(28px,6.5vw,46px); font-weight:700;
    letter-spacing:.5em; text-indent:.5em; color:#fff;
    text-shadow:0 0 10px var(--pink),0 0 28px var(--pink),0 0 60px rgba(255,0,127,.6);
  }
  header p{margin:6px 0 0;font-size:clamp(10px,2.4vw,13px);letter-spacing:.38em;text-indent:.38em;color:var(--pink2);text-transform:uppercase}
  .bridge{margin-top:10px;font-size:11px;letter-spacing:.12em;padding:4px 10px;border:1px solid rgba(255,0,127,.3);display:inline-block}
  .bridge.on{color:var(--pink2);border-color:var(--pink2);box-shadow:0 0 10px rgba(255,0,127,.25)}
  .bridge.off{color:var(--dim)}

  /* ───── Réacteur holographique ───── */
  .reactor{position:relative;width:min(50vw,250px);aspect-ratio:1;margin:18px auto 6px;flex:none}
  .ring{position:absolute;border-radius:50%}
  .r1{inset:0;border:2px dashed rgba(255,0,127,.55);animation:spin 28s linear infinite}
  .r2{inset:11%;border:3px solid transparent;border-top-color:var(--pink);border-bottom-color:var(--pink2);
      animation:spin 9s linear infinite reverse;filter:drop-shadow(0 0 6px var(--pink))}
  .r3{inset:22%;border:2px dotted rgba(255,179,217,.75);animation:spin 14s linear infinite}
  .r4{inset:33%;border:3px solid transparent;border-left-color:var(--pink);border-right-color:var(--pink);
      animation:spin 5s linear infinite reverse;filter:drop-shadow(0 0 5px var(--pink))}
  .core{
    position:absolute;inset:42%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff 0%,#ff7ab8 26%,var(--pink) 62%,#7a0040 100%);
    box-shadow:0 0 28px 8px rgba(255,0,127,.7),0 0 80px 22px rgba(255,0,127,.35);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.38)}}
  .reactor.listening .core{animation-duration:1.5s}
  .reactor.thinking .r1{animation-duration:4s}
  .reactor.thinking .r2{animation-duration:1.6s}
  .reactor.thinking .r3{animation-duration:3s}
  .reactor.thinking .r4{animation-duration:1s}
  .reactor.speaking .core{animation:talk .45s ease-in-out infinite}
  .state{font-size:11px;letter-spacing:.35em;text-indent:.35em;color:var(--pink2);text-align:center;min-height:16px;margin-bottom:10px}

  /* ───── Terminal de discussion ───── */
  .term{
    width:min(900px,100%); flex:1 1 auto; min-height:210px; max-height:46vh;
    display:flex; flex-direction:column;
    border:1px solid var(--pink); background:rgba(12,0,7,.62);
    box-shadow:0 0 18px rgba(255,0,127,.25), inset 0 0 22px rgba(255,0,127,.06);
    backdrop-filter:blur(6px);
  }
  .term-head{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;font-size:10.5px;letter-spacing:.2em;
    color:var(--pink2);border-bottom:1px solid rgba(255,0,127,.35);text-transform:uppercase}
  .log{flex:1;overflow-y:auto;padding:10px 14px;font-size:14px;line-height:1.55;scrollbar-width:thin;scrollbar-color:var(--pink) transparent}
  .line{margin:0 0 7px;white-space:pre-wrap;word-wrap:break-word}
  .line.sys{color:var(--dim);font-size:12.5px}
  .line.user{color:var(--light)}
  .line.ray{color:var(--pink);text-shadow:0 0 8px rgba(255,0,127,.35)}
  .interim{padding:0 14px;min-height:20px;font-size:13px;color:var(--dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  form{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,0,127,.35);padding:6px 12px}
  form span{color:var(--pink)}
  form input{flex:1;background:transparent;border:none;outline:none;color:var(--light);font:14px var(--mono);padding:6px 0}
  form input::placeholder{color:var(--dim)}
  form button{background:transparent;border:1px solid rgba(255,0,127,.4);color:var(--pink);font:13px var(--mono);padding:4px 10px;cursor:pointer}

  /* ───── Bouton d'écoute ───── */
  .mic{
    margin-top:14px; width:min(900px,100%); flex:none; padding:20px 12px;
    font:700 clamp(13px,3.4vw,18px) var(--mono); letter-spacing:.22em; text-transform:uppercase;
    border:2px solid var(--pink); background:rgba(255,0,127,.08); color:var(--pink);
    cursor:pointer; box-shadow:0 0 18px rgba(255,0,127,.3); transition:.2s;
  }
  .mic:hover{background:rgba(255,0,127,.18)}
  .mic.on{background:var(--pink);color:#1a000d;box-shadow:0 0 34px rgba(255,0,127,.85)}
  .mic:disabled{opacity:.4;cursor:not-allowed}
  @media(max-height:700px){.reactor{width:min(34vw,160px);margin-top:10px}}
</style>
</head>
<body>
  <header>
    <h1>R A Y L É</h1>
    <p>Market &amp; Neural Core</p>
    <div class="bridge off" id="bridgeStatus">PONT TERMINAL · …</div>
  </header>

  <div class="reactor idle" id="reactor">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
    <div class="core"></div>
  </div>
  <div class="state" id="state">VEILLE</div>

  <section class="term">
    <div class="term-head"><span>Terminal de discussion</span><span id="voiceName">voix : …</span></div>
    <div class="log" id="log"></div>
    <div class="interim" id="interim"></div>
    <form id="form" autocomplete="off">
      <span>&gt;</span>
      <input id="txt" type="text" placeholder="…ou écrivez ici, Monsieur">
      <button type="submit">↵</button>
    </form>
  </section>

  <button class="mic" id="btn"><span id="btnTxt">Activer l'écoute</span></button>

<script>
(function(){
  "use strict";

  const $=id=>document.getElementById(id);
  const BRIDGE_KEY='rayle_terminal_bridge';
  const reactor=$('reactor'), logEl=$('log'), stateEl=$('state'), interimEl=$('interim'),
        btn=$('btn'), btnTxt=$('btnTxt'), form=$('form'), txt=$('txt'),
        bridgeEl=$('bridgeStatus'), voiceEl=$('voiceName');

  /* ═════════════ ÉTAT & JOURNAL ═════════════ */
  const STATES={idle:'VEILLE',listening:'ÉCOUTE EN COURS',thinking:'ANALYSE',speaking:'TRANSMISSION'};
  function setState(s){ reactor.className='reactor '+s; stateEl.textContent=STATES[s]||''; }
  function stamp(){ return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
  function addLine(kind,text){
    const d=document.createElement('div'); d.className='line '+kind;
    const prefix = kind==='sys' ? '['+stamp()+'] ' : kind==='user' ? 'VOUS › ' : 'RAYLÉ › ';
    d.textContent=prefix+String(text);
    logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
    while(logEl.children.length>200) logEl.removeChild(logEl.firstChild);
  }
  const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

  /* ═════════════ PONT AVEC LE TERMINAL ═════════════ */
  function readBridge(){
    try{
      const raw=localStorage.getItem(BRIDGE_KEY); if(!raw) return null;
      const o=JSON.parse(raw);
      return (o && typeof o==='object') ? o : null;
    }catch(e){ return null; }
  }
  function fmtNum(v){ const n=Number(v); return isFinite(n) ? n.toLocaleString('fr-FR',{maximumFractionDigits:2}) : String(v); }
  function fmtAge(iso){
    const ms=Date.now()-new Date(iso).getTime(); if(!isFinite(ms)) return '';
    const m=Math.round(ms/60000);
    return m<1 ? "à l'instant" : m<60 ? 'il y a '+m+' min' : 'il y a '+Math.round(m/60)+' h';
  }
  const pairs=o=>Object.entries(o).map(([k,v])=>k+' '+v).join(', ');

  // Résumé injecté dans le contexte de l'IA
  function bridgeSummary(b){
    if(!b) return '';
    const p=[];
    if(b.actif) p.push('actif affiché : '+b.actif+(b.unite_graphique?' en '+b.unite_graphique:''));
    if(b.prix!=null) p.push('prix '+fmtNum(b.prix));
    if(b.tendance_globale) p.push('tendance globale '+b.tendance_globale);
    if(b.score_global!=null) p.push('score global '+b.score_global+' sur 100');
    if(b.tendances && typeof b.tendances==='object') p.push('tendance par unité de temps : '+pairs(b.tendances));
    if(b.rsi && typeof b.rsi==='object') p.push('RSI : '+pairs(b.rsi));
    if(b.volume_net && typeof b.volume_net==='object') p.push('volume net en dollars (positif = acheteurs) : '+pairs(b.volume_net));
    if(b.support!=null) p.push('support '+fmtNum(b.support));
    if(b.resistance!=null) p.push('résistance '+fmtNum(b.resistance));
    if(b.notes && String(b.notes).trim()) p.push('notes stratégiques de Monsieur : « '+String(b.notes).trim().slice(0,600)+' »');
    if(b.maj) p.push('données mises à jour '+fmtAge(b.maj));
    return p.join(' ; ');
  }

  function updateBridgeStatus(){
    const b=readBridge();
    if(!b){ bridgeEl.textContent='PONT TERMINAL · aucune donnée'; bridgeEl.className='bridge off'; return; }
    const bits=[];
    if(b.actif) bits.push(b.actif);
    if(b.tendance_globale) bits.push(b.tendance_globale);
    if(b.score_global!=null) bits.push(b.score_global+'/100');
    if(b.maj) bits.push(fmtAge(b.maj));
    bridgeEl.textContent='PONT TERMINAL · '+(bits.join(' · ')||'notes uniquement');
    bridgeEl.className='bridge on';
  }
  setInterval(updateBridgeStatus,3000);
  window.addEventListener('storage',e=>{ if(e.key===BRIDGE_KEY) updateBridgeStatus(); });

  /* ═════════════ NETTOYAGE DU TEXTE POUR LA VOIX ═════════════ */
  function clean(t){
    return String(t||'')
      .replace(/```[\s\S]*?```/g,' ')
      .replace(/https?:\/\/\S+/g,' ')
      .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'')
      .replace(/[\u00a0\u202f]/g,' ')
      .replace(/%/g,' pour cent').replace(/€/g,' euros').replace(/\$/g,' dollars').replace(/&/g,' et ')
      .replace(/[*_`#~>|\\^=+<>{}\[\]]/g,' ')
      .replace(/[«»"“”„]/g,'')
      .replace(/[()]/g,', ')
      .replace(/\s[-–—]+\s/g,', ')
      .replace(/\s+,/g,',').replace(/,\s*,+/g,',')
      .replace(/\s+/g,' ').trim();
  }

  /* ═════════════ SYNTHÈSE VOCALE ═════════════ */
  let voices=[], chosenVoice=null, speaking=false, speakToken=0;
  function pickVoice(){
    const fr=voices.filter(v=>/^fr/i.test(v.lang));
    return fr.find(v=>/paul|henri|thomas|claude|antoine|mathieu|nicolas|male|homme/i.test(v.name))
        || fr.find(v=>/fr-FR/i.test(v.lang)) || fr[0] || null;
  }
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices=speechSynthesis.getVoices();
    chosenVoice=pickVoice();
    voiceEl.textContent='voix : '+(chosenVoice ? chosenVoice.name.replace(/Microsoft |Google /,'') : 'système');
  }
  if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }

  function splitChunks(t){
    const sents=t.match(/[^.!?;:]+[.!?;:]*/g)||[t];
    const parts=[];
    sents.forEach(s=>{
      if(s.length>200){ s.split(/,\s*/).forEach((p,i,a)=>parts.push(p+(i<a.length-1?',':''))); }
      else parts.push(s);
    });
    const out=[]; let cur='';
    parts.forEach(s=>{
      if((cur+s).length>170 && cur){ out.push(cur.trim()); cur=s; } else cur+=s;
    });
    if(cur.trim()) out.push(cur.trim());
    return out;
  }

  function speak(text){
    return new Promise(resolve=>{
      const t=clean(text);
      if(!t || !('speechSynthesis' in window)){ resolve(); return; }
      const token=++speakToken;
      speaking=true; stopRecSoft(); setState('speaking');
      speechSynthesis.cancel();
      const chunks=splitChunks(t); let i=0;

      const finish=()=>{
        if(token!==speakToken){ resolve(); return; }
        speaking=false;
        setState(listening?'listening':'idle');
        if(listening) setTimeout(startRec,350);
        resolve();
      };
      const next=()=>{
        if(token!==speakToken){ resolve(); return; }
        if(i>=chunks.length){ finish(); return; }
        const piece=chunks[i++];
        const u=new SpeechSynthesisUtterance(piece);
        if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; } else u.lang='fr-FR';
        u.pitch=0.78;   // timbre grave de majordome
        u.rate=1.05;
        u.volume=1;
        let fired=false;
        const go=()=>{ if(fired) return; fired=true; clearTimeout(tm); next(); };
        const tm=setTimeout(go, 4000+piece.length*110);   // garde-fou si « onend » n'arrive pas
        u.onend=go; u.onerror=go;
        speechSynthesis.speak(u);
      };
      setTimeout(next,60);
    });
  }
  function cancelSpeech(){
    speakToken++;
    if('speechSynthesis' in window) speechSynthesis.cancel();
    speaking=false;
  }

  /* ═════════════ INTELLIGENCE : IA EN LIGNE ═════════════ */
  const history=[];

  function systemPrompt(){
    let s="Tu es Raylé, l'assistant personnel de Monsieur, trader (Nasdaq, Or, Bitcoin, Solana, EUR/USD, pétrole…). "
      +"Tu es un majordome élégant, posé et précis. Tu t'adresses toujours à lui en disant « Monsieur ». "
      +"Tu réponds en français, à l'oral : une à trois phrases courtes, naturelles, sans liste, sans markdown, sans émoji, sans symbole. "
      +"Tu peux discuter de tout. Quand il parle de marché, appuie-toi sur l'état du terminal ci-dessous : tu décris ce que montrent les données et tu lui laisses la décision, sans jamais donner d'ordre ferme d'achat ou de vente. "
      +"Si tu ne sais pas, dis-le simplement.";
    const b=readBridge();
    if(b){ const sm=bridgeSummary(b); if(sm) s+="\nÉtat actuel du terminal de Monsieur : "+sm+"."; }
    s+="\nDate et heure : "+new Date().toLocaleString('fr-FR')+".";
    return s;
  }

  async function fetchT(url,opts,ms){
    const c=new AbortController(); const tm=setTimeout(()=>c.abort(),ms);
    try{ return await fetch(url,Object.assign({},opts,{signal:c.signal})); }
    finally{ clearTimeout(tm); }
  }

  // Extrait un texte lisible de n'importe quelle forme de réponse (jamais d'objet brut)
  function extractText(data){
    if(data==null) return '';
    if(typeof data==='string'){
      const t=data.trim();
      if(t[0]==='{' || t[0]==='['){ try{ return extractText(JSON.parse(t)); }catch(e){ return ''; } }
      return t;
    }
    if(Array.isArray(data)) return data.map(extractText).join(' ').trim();
    if(typeof data==='object'){
      if(data.error) return '';
      if(Array.isArray(data.choices) && data.choices[0]){
        const c=data.choices[0], m=c.message||c;
        return extractText(m.content!=null ? m.content : (m.text!=null ? m.text : ''));
      }
      for(const k of ['content','text','reply','output','response','message']){
        if(typeof data[k]==='string') return data[k].trim();
      }
    }
    return '';
  }
  function stripAds(t){
    return String(t||'').replace(/\n*[-_*\s]*\**\s*(?:Powered by|Support)\s+Pollinations[\s\S]*$/i,'').trim();
  }
  function valid(t){
    return typeof t==='string' && t.trim().length>1 && /[A-Za-zÀ-ÿ0-9]/.test(t)
        && !/^[\s{}\[\]",:]*$/.test(t) && !/^\s*\{/.test(t);
  }

  // Niveau 1 : endpoint compatible OpenAI de Pollinations (sans clé)
  async function aiPrimary(text){
    const msgs=[{role:'system',content:systemPrompt()}].concat(history,[{role:'user',content:text}]);
    const res=await fetchT('https://text.pollinations.ai/openai',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai',messages:msgs,temperature:0.7})
    },10000);
    if(!res.ok) throw new Error('HTTP '+res.status);
    return stripAds(extractText(await res.text()));
  }
  // Niveau 2 : endpoint GET simple de Pollinations
  async function aiSecondary(text){
    const url='https://text.pollinations.ai/'+encodeURIComponent(text.slice(0,400))
      +'?model=openai&system='+encodeURIComponent(systemPrompt().slice(0,1100));
    const res=await fetchT(url,{method:'GET'},7000);
    if(!res.ok) throw new Error('HTTP '+res.status);
    return stripAds(extractText(await res.text()));
  }

  /* ═════════════ NIVEAU 3 : CERVEAU DE SECOURS LOCAL ═════════════ */
  function marketAnswer(b,wantNotes){
    if(!b) return "Je ne perçois aucune donnée du terminal, Monsieur. Ouvrez-le dans ce même navigateur et laissez-le charger quelques instants.";
    const notes=(b.notes && String(b.notes).trim()) ? String(b.notes).trim() : '';
    if(wantNotes){
      return notes ? "Voici vos notes, Monsieur : "+notes.slice(0,400) : "Vos notes sont vides pour le moment, Monsieur.";
    }
    const p=[];
    if(b.actif){
      let s='Sur '+b.actif;
      if(b.tendance_globale) s+=', la tendance globale est '+String(b.tendance_globale).toLowerCase();
      if(b.score_global!=null) s+=', avec un score de '+b.score_global+' sur 100';
      p.push(s+'.');
    }
    if(b.rsi && b.rsi.H1!=null) p.push('Le RSI en H1 est à '+b.rsi.H1+'.');
    if(b.support!=null && b.resistance!=null) p.push('Le support le plus proche se situe à '+fmtNum(b.support)+' et la résistance à '+fmtNum(b.resistance)+'.');
    if(!p.length) return "Le terminal ne m'a pas encore transmis ses analyses, Monsieur."+(notes?" Je vois toutefois que vous avez des notes en cours.":'');
    p.push("Il s'agit d'une simple lecture des données, Monsieur : la décision vous appartient.");
    return p.join(' ');
  }

  function localBrain(text){
    const n=norm(text); const h=new Date().getHours();
    if(/\b(bonjour|salut|coucou|hello|bonsoir)\b/.test(n)) return (h>=18||h<5?'Bonsoir':'Bonjour')+", Monsieur. Je suis à votre service.";
    if(/quelle heure|l'heure|\bheure\b/.test(n)) return "Il est "+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':',' heures ')+", Monsieur.";
    if(/quel jour|la date|\bdate\b|aujourd/.test(n)) return "Nous sommes le "+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+", Monsieur.";
    if(/\bmerci\b/.test(n)) return "Je vous en prie, Monsieur.";
    if(/qui es[- ]?tu|ton nom|comment tu t'?appelles|presente[- ]?toi/.test(n)) return "Je suis Raylé, votre assistant personnel, Monsieur. Mon rôle est de veiller sur vos marchés et de vous répondre à la voix.";
    if(/ca va|comment vas[- ]?tu|tu vas bien/.test(n)) return "Parfaitement, Monsieur, et prêt à vous servir.";
    if(/\bnotes?\b/.test(n)) return marketAnswer(readBridge(),true);
    if(/march|terminal|nasdaq|bitcoin|btc|solana|\bsol\b|\bor\b|gold|eur|dollar|petrole|analys|tendance|rsi|score|support|resistance|niveau|situation|graphique|ecran/.test(n)) return marketAnswer(readBridge(),false);
    const short=String(text).trim().slice(0,90);
    return "Je vous ai bien entendu, Monsieur : « "+short+" ». Mon intelligence en ligne ne répond pas pour l'instant, mais je reste à votre service pour l'état du terminal, vos notes, l'heure ou la date.";
  }

  /* ═════════════ TRAITEMENT D'UNE PHRASE ═════════════ */
  async function respond(text){
    setState('thinking');
    let reply='';
    try{ reply=await aiPrimary(text); }
    catch(e){ addLine('sys','IA principale : '+(e.name==='AbortError'?'délai dépassé':e.message)); }
    if(!valid(reply)){
      try{ reply=await aiSecondary(text); }
      catch(e){ addLine('sys','IA secondaire : '+(e.name==='AbortError'?'délai dépassé':e.message)); }
    }
    if(!valid(reply)){
      reply=localBrain(text);
      addLine('sys','Mode secours local');
    }else{
      history.push({role:'user',content:text},{role:'assistant',content:reply});
      while(history.length>10) history.shift();
    }
    addLine('ray',reply);
    await speak(reply);
  }

  const queue=[]; let processing=false;
  async function drain(){
    processing=true;
    while(queue.length){ const t=queue.shift(); try{ await respond(t); }catch(e){ addLine('sys','Erreur interne : '+e.message); } }
    processing=false;
    if(!speaking) setState(listening?'listening':'idle');
  }

  // Commandes vocales courtes
  function command(text){
    const n=norm(text).trim();
    if(/^(tais[- ]?toi|silence|stop|ca suffit)[.!\s]*$/.test(n)){
      cancelSpeech(); queue.length=0; addLine('sys','Parole interrompue');
      setState(listening?'listening':'idle'); if(listening) setTimeout(startRec,300);
      return true;
    }
    if(/(arrete|coupe|desactive).{0,12}(ecoute|micro)|mets[- ]?toi en veille/.test(n)){
      addLine('ray',"Très bien, Monsieur. Je me mets en veille."); stopListening(); return true;
    }
    return false;
  }
  function onUser(text){
    text=String(text||'').trim(); if(!text) return;
    addLine('user',text);
    if(command(text)) return;
    queue.push(text);
    if(!processing) drain();
  }

  /* ═════════════ RECONNAISSANCE VOCALE ═════════════ */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, listening=false, lastStart=0;

  function buildRec(){
    const r=new SR();
    r.lang='fr-FR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
    r.onresult=e=>{
      let interim='', fin='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t; else interim+=t;
      }
      interimEl.textContent=interim ? '… '+interim : '';
      if(fin.trim()){ interimEl.textContent=''; onUser(fin); }
    };
    r.onerror=e=>{
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){
        addLine('sys',"Micro refusé : autorisez-le dans Chrome (cadenas à gauche de l'adresse), puis réessayez.");
        stopListening();
      }else if(e.error==='network'){
        addLine('sys','Reconnaissance vocale : réseau indisponible.');
      }
    };
    r.onend=()=>{
      interimEl.textContent='';
      if(listening && !speaking){
        const wait=(Date.now()-lastStart<800)?1000:250;
        setTimeout(startRec,wait);
      }
    };
    return r;
  }
  function startRec(){
    if(!SR || !listening || speaking) return;
    try{
      if(!rec) rec=buildRec();
      lastStart=Date.now();
      rec.start();
    }catch(e){
      if(e && e.name==='InvalidStateError') return;   // déjà en cours
      try{ rec=buildRec(); lastStart=Date.now(); rec.start(); }catch(_){}
    }
  }
  function stopRecSoft(){ try{ rec && rec.stop(); }catch(e){} }

  let greeted=false;
  function startListening(){
    if(!SR) return;
    listening=true;
    btn.classList.add('on'); btnTxt.textContent="Écoute active · toucher pour couper";
    setState('listening'); addLine('sys','Écoute vocale activée (fr-FR, mode continu)');
    startRec();
    if(!greeted){
      greeted=true;
      const g="Raylé en ligne. À votre service, Monsieur.";
      addLine('ray',g); speak(g);
    }
  }
  function stopListening(){
    listening=false;
    try{ rec && rec.abort(); }catch(e){}
    cancelSpeech(); queue.length=0;
    interimEl.textContent='';
    btn.classList.remove('on'); btnTxt.textContent="Activer l'écoute";
    setState('idle'); addLine('sys','Écoute vocale désactivée');
  }

  btn.addEventListener('click',()=> listening ? stopListening() : startListening());
  form.addEventListener('submit',e=>{ e.preventDefault(); const v=txt.value; txt.value=''; onUser(v); });

  /* ═════════════ DÉMARRAGE ═════════════ */
  setState('idle');
  addLine('sys','RAYLÉ — Market & Neural Core · noyau initialisé');
  if(SR){ addLine('sys','Reconnaissance vocale fr-FR : disponible'); }
  else{
    addLine('sys','Reconnaissance vocale indisponible : ouvrez cette page dans Google Chrome. La saisie au clavier reste active.');
    btn.disabled=true; btnTxt.textContent='Micro indisponible';
  }
  addLine('sys', readBridge() ? 'Pont terminal détecté' : 'Pont terminal : aucune donnée pour le moment');
  const hh=new Date().getHours();
  addLine('ray',(hh>=18||hh<5?'Bonsoir':'Bonjour')+", Monsieur. Touchez le bouton ci-dessous pour activer l'écoute.");
  updateBridgeStatus();
})();
</script>
</body>
