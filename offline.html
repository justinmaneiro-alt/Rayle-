<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<title>Raylé · hors ligne</title>
<style>
  html,body{margin:0;height:100%;background:#05080c;color:#dbe9ef;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:grid;place-content:center;gap:14px;padding:24px;text-align:center}
  h1{margin:0;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#fff;font-weight:600}
  p{margin:0;max-width:42ch;color:#9db6c0}
  button{justify-self:center;margin-top:8px;padding:12px 22px;font:inherit;color:#8fd0e3;background:rgba(143,208,227,.08);border:1px solid rgba(143,208,227,.5);cursor:pointer}
  button:hover{background:rgba(143,208,227,.2)}
</style>
</head>
<body>
<main>
  <h1>Raylé</h1>
  <p>Tu es hors ligne et cette page n’a pas encore été visitée : je n’ai donc rien à t’afficher. Les pages déjà ouvertes restent disponibles ; les actualités, la météo et la voix reviennent dès que le réseau revient.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
