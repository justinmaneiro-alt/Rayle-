<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic du Worker</title>
<style>body{font:14px/1.5 ui-monospace,Consolas,monospace;background:#0b1220;color:#dbe8f5;margin:0;padding:20px;max-width:900px}h1{font-size:16px;letter-spacing:.2em;color:#4de3ff}
.l{border:1px solid #234;padding:8px 12px;margin:8px 0;border-radius:4px}.ok{border-color:#3fbf7f}.ko{border-color:#ff5470}.at{border-color:#ffb347}b{color:#fff}small{color:#8fa9bf;display:block;white-space:pre-wrap;word-break:break-word}button{font:inherit;background:#4de3ff22;color:#4de3ff;border:1px solid #4de3ff;padding:6px 14px;cursor:pointer}</style></head>
<body><h1>DIAGNOSTIC DU WORKER</h1>
<p>Lit l'adresse et le jeton déjà enregistrés dans <b>ce navigateur</b> (rien n'est affiché ni envoyé ailleurs qu'au Worker). Aucune modification.</p>
<p id="cible"></p><button id="go">Relancer les tests</button><div id="res"></div>
<script>
const K=k=>{try{return (localStorage.getItem(k)||'').trim()}catch(e){return ''}};
const url=K('rayle_worker_url').replace(/\/+$/,''), tok=K('rayle_worker_token');
document.getElementById('cible').innerHTML='Worker testé : <b>'+(url||'aucun (ouvrez Raylé et configurez-le d’abord)')+'</b> · jeton : <b>'+(tok?'présent':'absent')+'</b>';
const res=document.getElementById('res');
function ligne(nom,etat,detail){const d=document.createElement('div');d.className='l '+etat;d.innerHTML='<b>'+nom+'</b> — '+({ok:'OK',ko:'ÉCHEC',at:'attendu au début'}[etat])+'<small></small>';d.querySelector('small').textContent=detail;res.appendChild(d)}
async function appel(chemin,opt={}){const t0=performance.now();const r=await fetch(url+chemin,{...opt,headers:{'X-Rayle-Token':tok,...(opt.headers||{})}});let t=await r.text();return{http:r.status,ms:Math.round(performance.now()-t0),t,j:(()=>{try{return JSON.parse(t)}catch(e){return null}})()}}
async function tout(){res.innerHTML='';if(!url||!tok){ligne('configuration','ko','Worker ou jeton absent dans ce navigateur.');return}
 const essais=[
  ['/ping',async()=>{const r=await appel('/ping');return[r.http===200&&r.j&&r.j.ok!==false?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · version '+(r.j&&r.j.version)+' · IA : '+((r.j&&r.j.ia)||[]).join(' → ')+' · D1 '+(r.j&&r.j.d1)]}],
  ['/actualites/fil?portee=france',async()=>{const r=await appel('/actualites/fil?portee=france');if(r.http===503)return['at','HTTP 503 · '+(r.j&&r.j.error)];return[r.http===200&&r.j&&r.j.sujets&&r.j.sujets.length?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · '+(r.j&&r.j.sujets?r.j.sujets.length+' sujets, '+r.j.sources.ok.length+' médias lus, mis à jour '+r.j.genere:r.t.slice(0,200))+(r.j&&r.j.perime?' · COPIE ANCIENNE':'')]}],
  ['/actualites/fil?portee=monde',async()=>{const r=await appel('/actualites/fil?portee=monde');if(r.http===503)return['at','HTTP 503 · '+(r.j&&r.j.error)];return[r.http===200&&r.j&&r.j.sujets&&r.j.sujets.length?'ok':'ko','HTTP '+r.http+' · '+(r.j&&r.j.sujets?r.j.sujets.length+' sujets, GDELT : '+JSON.stringify(r.j.sources.gdelt):r.t.slice(0,200))]}],
  ['/actualites/fil?portee=pays&pays=JP (calculé à la demande)',async()=>{const r=await appel('/actualites/fil?portee=pays&pays=JP');return[r.http===200&&r.j&&r.j.sujets&&r.j.sujets.length?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · '+(r.j&&r.j.sujets?r.j.sujets.length+' sujets':r.t.slice(0,200))]}],
  ['/meteo?lat=48.85&lon=2.35',async()=>{const r=await appel('/meteo?lat=48.85&lon=2.35');return[r.http===200&&r.j&&r.j.actuel&&r.j.actuel.temp!=null?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · '+(r.j&&r.j.actuel?r.j.actuel.temp+'° · modèle '+r.j.modele:r.t.slice(0,200))]}],
  ['/actualites?pays=FR (route de la fenêtre pays)',async()=>{const r=await appel('/actualites?pays=FR&n=6');return[r.http===200&&r.j&&r.j.titres&&r.j.titres.length?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · '+(r.j&&r.j.titres?r.j.titres.length+' titres':r.t.slice(0,200))]}],
  ['/images?q=tour Eiffel (images libres)',async()=>{const r=await appel('/images?q='+encodeURIComponent('tour Eiffel')+'&n=3');const n=r.j&&r.j.images&&r.j.images.length;return[r.http===200&&n?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · '+(n||0)+' image(s) · article : '+((r.j&&r.j.sujet&&r.j.sujet.titre)||'—')+' · '+(r.j&&r.j.raison||'')]}],
  ['/videos (savoir) : tour Eiffel — Wikimedia / Internet Archive',async()=>{const r=await appel('/videos?q='+encodeURIComponent('tour Eiffel')+'&type=savoir&n=3');const v=(r.j&&r.j.videos)||[];return[r.http===200&&v.length?'ok':(r.http===200?'at':'ko'),'HTTP '+r.http+' · '+r.ms+' ms · '+v.length+' vidéo(s) : '+v.map(x=>x.plateforme+' « '+x.titre.slice(0,40)+' » ('+x.licence.slice(0,30)+')').join(' | ')+' · '+(r.j&&(r.j.raison||r.j.error)||'')]}],
  ['/videos (actu) : un titre du fil — chaînes YouTube officielles',async()=>{const f=await appel('/actualites/fil?portee=monde');const t=f.j&&f.j.sujets&&f.j.sujets[0]&&f.j.sujets[0].titre;if(!t)return['at','pas de sujet dans le fil pour le moment'];const r=await appel('/videos?q='+encodeURIComponent(t)+'&type=actu&n=2');const v=(r.j&&r.j.videos)||[];return[r.http===200?'ok':'ko','sujet « '+t.slice(0,60)+' » · HTTP '+r.http+' · '+r.ms+' ms · '+v.length+' vidéo(s) (0 est normal si aucune chaîne n’en parle) : '+v.map(x=>x.auteur+' « '+x.titre.slice(0,40)+' »').join(' | ')+(r.j&&r.j.erreurs?' · erreurs : '+r.j.erreurs.join(' ; '):'')]}],
  ['/actualites/fil : vignettes des médias (nouveau)',async()=>{const r=await appel('/actualites/fil?portee=france');const s=(r.j&&r.j.sujets)||[];const n=s.filter(x=>x.image).length;return[r.http===200&&s.length&&n?'ok':(r.http===503?'at':'ko'),'HTTP '+r.http+' · '+s.length+' sujets dont '+n+' avec vignette'+(r.http===503?' · fil en préparation, relancez dans quelques minutes':'')+(s.length&&!n?' · aucune vignette : le fil en cache date d’avant la mise à jour, attendez le prochain cycle (≈ 15 min)':'')]}],
  ['/chat (agent, outils de la Terre)',async()=>{const r=await appel('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'montre-moi la Terre',agent:true,context:'',history:[]})});const a=r.j&&r.j.actions||[];return[r.http===200&&r.j&&r.j.reply?'ok':'ko','HTTP '+r.http+' · '+r.ms+' ms · moteur '+(r.j&&r.j.engine)+' · outils : '+JSON.stringify(r.j&&r.j.outils)+' · actions : '+JSON.stringify(a).slice(0,200)+' · réponse : '+((r.j&&r.j.reply)||r.t).slice(0,200)]}]
 ];
 for(const[n,f]of essais){try{const[e,d]=await f();ligne(n,e,d)}catch(x){ligne(n,'ko',String(x&&x.message||x))}}
}
document.getElementById('go').onclick=tout;tout();
</script></body></html>
