# Petit Worker « rayle-voix » : Gemini TTS (v7), cerveau (v8), Azure Speech (v9). Ne touche pas au Worker principal « rayle ».
# AUCUN déclencheur planifié (le compte en a déjà 4 sur 5). Secret unique : GEMINI_KEY.
# Les jetons sont vérifiés par le /ping du Worker principal (comme rayle-agent-trading).
# Déployer :  npx.cmd wrangler deploy --config worker-voix/wrangler.toml     Secret :  npx.cmd wrangler secret put GEMINI_KEY --config worker-voix/wrangler.toml
name = "rayle-voix"
main = "src/index.js"
compatibility_date = "2026-10-07"
preview_urls = false
workers_dev = true

[vars]
WORKER_RAYLE = "https://rayle.justinmaneiro.workers.dev"
ORIGINES = "https://justinmaneiro-alt.github.io,http://127.0.0.1:8000,http://localhost:8000"
GEMINI_TTS_LIMITE_JOUR = "90"

# Liaison de service vers le Worker principal (lecture seule : on n'y change rien). Un Worker du même compte ne peut pas appeler l'adresse workers.dev d'un autre (réponse 404) : on passe par la liaison.
[[services]]
binding = "PRINCIPAL"
service = "rayle"

# v9 : compteur de caractères Azure du mois (une écriture par phrase nouvelle, loin sous la limite gratuite de 1000 par jour).
# Secrets (à poser avec « wrangler secret put ») : AZURE_SPEECH_KEY, AZURE_SPEECH_REGION.
[[kv_namespaces]]
binding = "QUOTA"
id = "631b2fc8b1ea44d19ad87b1a94d38220"
